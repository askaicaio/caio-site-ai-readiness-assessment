
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Readiness Assessment | ChiefAIOfficer.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
      /* ─── Design tokens ───────────────────────────────────────────────── */
      :root {
        /* Surface */
        --bg-base: #0a0a18;
        --bg-base-soft: #10101f;

        /* Ink (text) */
        --ink: #f8fafc;
        --ink-soft: #cbd5e1;
        --ink-mute: #94a3b8;
        --ink-dim: #64748b;

        /* Lines / borders */
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.16);

        /* Accent */
        --accent: #818cf8;        /* indigo-400 */
        --accent-strong: #6366f1; /* indigo-500 */
        --accent-deep: #4f46e5;   /* indigo-600 */
        --accent-glow: rgba(99, 102, 241, 0.45);

        /* Status */
        --status-warn: #fbbf24;
        --status-rose: #fb7185;

        /* Motion */
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* ─── Base ───────────────────────────────────────────────────────── */
      html, body {
        background-color: var(--bg-base);
        color: var(--ink);
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11', 'ss01';
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      body { min-height: 100vh; position: relative; }

      /* ─── Background system ──────────────────────────────────────────── */
      /* Layer 1: gradient mesh — three soft, off-center glows */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(900px 600px at 12% 8%, rgba(129, 140, 248, 0.18), transparent 60%),
          radial-gradient(800px 520px at 92% 96%, rgba(67, 56, 202, 0.22), transparent 60%),
          radial-gradient(700px 420px at 96% 2%, rgba(168, 85, 247, 0.10), transparent 60%);
        z-index: 0;
        pointer-events: none;
      }

      /* Layer 2: subtle grid with center-fade mask — adds "expensive document" texture */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 64px 64px;
        -webkit-mask-image: radial-gradient(ellipse at center, #000 35%, transparent 80%);
                mask-image: radial-gradient(ellipse at center, #000 35%, transparent 80%);
        z-index: 0;
        pointer-events: none;
      }

      #root { position: relative; z-index: 1; }

      /* ─── Typography utility classes ─────────────────────────────────── */
      .kicker {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        line-height: 1;
      }

      .display-1 {
        font-size: clamp(36px, 5.2vw, 60px);
        line-height: 1.05;
        letter-spacing: -0.028em;
        font-weight: 600;
        color: var(--ink);
      }

      .display-2 {
        font-size: clamp(28px, 3.6vw, 40px);
        line-height: 1.15;
        letter-spacing: -0.022em;
        font-weight: 600;
        color: var(--ink);
      }

      .lead {
        font-size: 17px;
        line-height: 1.6;
        color: var(--ink-soft);
      }

      .accent-italic {
        font-family: 'Instrument Serif', 'Times New Roman', serif;
        font-style: italic;
        font-weight: 400;
        color: var(--accent);
        letter-spacing: 0.005em;
      }

      .tabular { font-variant-numeric: tabular-nums; }

      /* ─── Card system ───────────────────────────────────────────────── */
      .card-premium {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.018));
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow:
          0 28px 70px -24px rgba(0, 0, 0, 0.55),
          0 1px 0 rgba(255, 255, 255, 0.05) inset;
      }

      /* ─── Choice options ────────────────────────────────────────────── */
      .option-card {
        position: relative;
        background: rgba(255, 255, 255, 0.025);
        border: 1px solid var(--line);
        border-radius: 12px;
        transition:
          background 200ms var(--ease-out),
          border-color 200ms var(--ease-out),
          transform 200ms var(--ease-out);
        cursor: pointer;
      }
      .option-card:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: var(--line-strong);
      }
      .option-card.is-selected {
        background: rgba(99, 102, 241, 0.12);
        border-color: rgba(129, 140, 248, 0.6);
        box-shadow:
          0 0 0 1px rgba(129, 140, 248, 0.35),
          0 14px 32px -14px rgba(99, 102, 241, 0.5);
      }
      .option-card .indicator {
        width: 18px; height: 18px;
        border-radius: 999px;
        border: 1.5px solid rgba(255, 255, 255, 0.22);
        background: transparent;
        transition: all 180ms var(--ease-out);
        position: relative;
        flex-shrink: 0;
      }
      .option-card.is-selected .indicator {
        border-color: var(--accent);
        background: rgba(99, 102, 241, 0.2);
      }
      .option-card.is-selected .indicator::after {
        content: '';
        position: absolute;
        inset: 3.5px;
        border-radius: 999px;
        background: var(--accent);
      }
      /* Keyboard focus on the option's hidden input → visible ring on the
         option card itself, since the input is sr-only. */
      .option-card:focus-within {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* ─── Buttons ──────────────────────────────────────────────────── */
      .btn-primary {
        background: linear-gradient(180deg, var(--accent-strong), var(--accent-deep));
        color: white;
        font-weight: 600;
        font-size: 14px;
        border-radius: 10px;
        padding: 12px 22px;
        box-shadow:
          0 14px 32px -12px var(--accent-glow),
          0 1px 0 rgba(255, 255, 255, 0.2) inset;
        transition: transform 150ms var(--ease-out), filter 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
        white-space: nowrap;
      }
      .btn-primary:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); }
      .btn-primary:active:not(:disabled) { transform: translateY(0); }
      .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

      .btn-ghost {
        background: transparent;
        color: var(--ink-mute);
        font-weight: 500;
        font-size: 14px;
        border-radius: 10px;
        padding: 12px 18px;
        transition: color 150ms var(--ease-out), background 150ms var(--ease-out);
      }
      .btn-ghost:hover:not(:disabled) { color: var(--ink); background: rgba(255, 255, 255, 0.04); }
      .btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }

      /* ─── Inputs ──────────────────────────────────────────────────── */
      .input-premium {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        color: var(--ink);
        font-size: 15px;
        transition: border-color 180ms var(--ease-out), background 180ms var(--ease-out), box-shadow 180ms var(--ease-out);
      }
      .input-premium::placeholder { color: var(--ink-dim); }
      .input-premium:hover { border-color: var(--line-strong); background: rgba(255, 255, 255, 0.045); }
      .input-premium:focus {
        outline: none;
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.045);
        box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
      }
      /* Native <option> elements inherit very little from the parent — without
         these the OS renders the dropdown panel white and our white text
         disappears against it. */
      .input-premium option {
        background-color: var(--bg-base-soft);
        color: var(--ink);
        padding: 8px;
      }
      .input-premium option:checked {
        background-color: var(--accent-deep);
        color: #ffffff;
      }
      /* Style the disabled placeholder option (e.g. "Select your role…") in
         a softer colour so it reads as a hint, not as a real choice. */
      .input-premium option[value=""] {
        color: var(--ink-mute);
      }

      /* ─── Focus accessibility ──────────────────────────────────────── */
      *:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }
      button:focus-visible, a:focus-visible, label:focus-visible { outline-offset: 3px; }

      /* ─── Motion utility ───────────────────────────────────────────── */
      @keyframes premium-fade {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: premium-fade 380ms var(--ease-out) both;
      }

      /* ─── Scrollbar polish (webkit) ────────────────────────────────── */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.14); }

      /* ─── Respect prefers-reduced-motion ──────────────────────────── */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* ─── Mobile spacing tightening ───────────────────────────────── */
      @media (max-width: 640px) {
        .card-premium { border-radius: 16px; }
        body::after { background-size: 48px 48px; }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
